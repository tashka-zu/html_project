<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Подключение Bootstrap CSS через CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .min-vh-100 {
            min-height: 100vh;
        }
        .sidebar {
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            z-index: 100;
        }
        .main-content {
            margin-left: 16.666667%;
        }
    </style>
    <title>Контакты</title>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Боковое меню -->
            <div class="col-md-2 bg-dark min-vh-100 d-flex flex-column justify-content-between sidebar">
                <div>
                    <div class="text-white p-3 fs-4">
                        МЕНЮ
                    </div>
                    <ul class="nav nav-pills flex-column p-2">
                        <li class="nav-item">
                            <a class="nav-link text-white" href="index.html">Главная</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white" href="catalog.html">Категории</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white" href="#">Заказы</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link text-white active bg-primary" aria-current="page" href="contacts.html">Контакты</a>
                        </li>
                    </ul>
                </div>
                <div class="p-3">
                    <div class="dropdown">
                        <a class="d-flex align-items-center text-white text-decoration-none dropdown-toggle" id="dropdownUser1" data-bs-toggle="dropdown">
                            <strong>Пользователь</strong>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-dark text-small shadow">
                            <li><a class="dropdown-item" href="#">Профиль</a></li>
                            <li><hr class="dropdown-divider"></hr></li>
                            <li><a class="dropdown-item" href="#">Выйти</a></li>
                        </ul>
                    </div>
                </div>
            </div>
            <!-- Основной контент -->
            <div class="col-md-10 main-content p-4">
                <h1 class="text-center mb-4">Контакты</h1>
                <div class="row">
                    <!-- Форма обратной связи -->
                    <div class="col-md-5 mb-4">
                        <div class="card shadow-sm p-4">
                            <form>
                                <div class="mb-3">
                                    <label for="nameInput" class="form-label">Имя</label>
                                    <input type="text" class="form-control" id="nameInput" placeholder="Ваше имя">
                                </div>
                                <div class="mb-3">
                                    <label for="emailInput" class="form-label">Почта</label>
                                    <div class="input-group">
                                        <span class="input-group-text">@</span>
                                        <input type="email" class="form-control" id="emailInput" placeholder="Ваш email">
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <label for="messageTextarea" class="form-label">Сообщение</label>
                                    <textarea class="form-control" id="messageTextarea" rows="4" placeholder="Ваше сообщение"></textarea>
                                </div>
                                <button type="submit" class="btn btn-primary">Отправить</button>
                            </form>
                        </div>
                    </div>
                    <!-- Контактная информация -->
                    <div class="col-md-7">
                        <h3>Наши контакты</h3>
                        <p>
                            Вы можете связаться с нами через форму обратной связи или по указанным контактам.
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- Подключение Bootstrap JS через CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
