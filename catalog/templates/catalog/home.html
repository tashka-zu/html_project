{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <h1>Список товаров</h1>
    <a href="{% url 'product_create' %}" class="btn btn-success mb-3">Добавить товар</a>
    <div class="row">
        {% for product in products %}
        <div class="col-md-4 mb-4">
            <div class="card">
                {% if product.image %}
                <img src="{{ product.image.url }}" class="card-img-top" alt="{{ product.name }}">
                {% else %}
                <img src="https://via.placeholder.com/300" class="card-img-top" alt="No image">
                {% endif %}
                <div class="card-body">
                    <h5 class="card-title">{{ product.name }}</h5>
                    <p class="card-text">
                        {{ product.description|truncatechars:100 }}
                    </p>
                    <p class="card-text"><strong>Цена:</strong> {{ product.price }}</p>
                    <a href="{% url 'product_detail' product.pk %}" class="btn btn-primary">Подробнее</a>
                    <a href="{% url 'product_edit' product.pk %}" class="btn btn-warning">Редактировать</a>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
