{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <h1>{% if object %}Редактировать запись{% else %}Создать запись{% endif %}</h1>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Сохранить</button>
    </form>
</div>
{% endblock %}
